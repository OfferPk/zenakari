<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#1e2d42" />
      <stop offset="60%" stop-color="#0f1724" />
      <stop offset="100%" stop-color="#070a10" />
    </radialGradient>

    <!-- Lantern Amber Glow -->
    <radialGradient id="amber-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1" />
      <stop offset="35%" stop-color="#f59e0b" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#d97706" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#b45309" stop-opacity="0" />
    </radialGradient>

    <!-- Lantern Core Fire -->
    <radialGradient id="fire-grad" cx="50%" cy="60%" r="40%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fef08a" />
      <stop offset="80%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </radialGradient>

    <!-- Stone Texture Gradients -->
    <linearGradient id="stone-roof" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="stone-post" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Filter for Dreamy Light -->
    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#fbbf24" stroke-opacity="0.15" stroke-width="4" />

  <!-- Four Directional Ray Beams -->
  <path d="M256,120 L256,20" stroke="#fbbf24" stroke-opacity="0.35" stroke-width="12" stroke-linecap="round" />
  <path d="M256,380 L256,480" stroke="#fbbf24" stroke-opacity="0.35" stroke-width="12" stroke-linecap="round" />
  <path d="M130,250 L30,250" stroke="#fbbf24" stroke-opacity="0.35" stroke-width="12" stroke-linecap="round" />
  <path d="M382,250 L482,250" stroke="#fbbf24" stroke-opacity="0.35" stroke-width="12" stroke-linecap="round" />

  <!-- Ambient Golden Glow behind lantern chamber -->
  <circle cx="256" cy="245" r="160" fill="url(#amber-glow)" opacity="0.9" />

  <!-- Japanese Stone Lantern Structure (Kasuga Tōrō) -->

  <!-- 1. Jewel Finial (Hōju / 宝珠) -->
  <path d="M256,92 C266,92 274,102 274,114 C274,124 264,132 256,136 C248,132 238,124 238,114 C238,102 246,92 256,92 Z" fill="#64748b" />
  <ellipse cx="256" cy="136" rx="22" ry="7" fill="#475569" />

  <!-- 2. Pagoda Roof (Kasa / 笠) -->
  <path d="M256,134 Q340,165 376,195 L346,204 Q256,188 166,204 L136,195 Q172,165 256,134 Z" fill="url(#stone-roof)" />
  <!-- Under-roof rim -->
  <polygon points="160,202 352,202 344,212 168,212" fill="#1e293b" />

  <!-- 3. Light Chamber (Hibukuro / 火袋) with glowing warm paper lattice -->
  <rect x="180" y="210" width="152" height="78" rx="8" fill="#1e1810" />
  <!-- Glowing Paper Window -->
  <rect x="188" y="216" width="136" height="66" rx="4" fill="url(#fire-grad)" filter="url(#bloom)" />
  <!-- Chamber Pillars / Frame -->
  <rect x="180" y="210" width="14" height="78" fill="#334155" />
  <rect x="318" y="210" width="14" height="78" fill="#334155" />
  <rect x="249" y="210" width="14" height="78" fill="#334155" opacity="0.8" />
  <rect x="180" y="244" width="152" height="10" fill="#334155" opacity="0.8" />

  <!-- Central Fire Core -->
  <ellipse cx="256" cy="248" rx="20" ry="24" fill="#ffffff" filter="url(#bloom)" opacity="0.95" />

  <!-- 4. Platform Base (Chūdai / 中台) -->
  <path d="M168,286 L344,286 L360,314 L152,314 Z" fill="url(#stone-roof)" />

  <!-- 5. Stone Column (Sao / 竿) -->
  <rect x="228" y="314" width="56" height="88" rx="4" fill="url(#stone-post)" />
  <rect x="222" y="350" width="68" height="10" rx="3" fill="#475569" />

  <!-- 6. Ground Base (Kiso / 基礎) -->
  <path d="M184,398 L328,398 L354,432 L158,432 Z" fill="url(#stone-roof)" />
  <rect x="146" y="430" width="220" height="18" rx="5" fill="#1e293b" />

  <!-- Subtle Starlight Particles -->
  <circle cx="110" cy="120" r="3" fill="#fef08a" opacity="0.7" />
  <circle cx="395" cy="115" r="2.5" fill="#fef08a" opacity="0.6" />
  <circle cx="95" cy="370" r="2" fill="#fef08a" opacity="0.5" />
  <circle cx="410" cy="360" r="3" fill="#fef08a" opacity="0.7" />
</svg>
